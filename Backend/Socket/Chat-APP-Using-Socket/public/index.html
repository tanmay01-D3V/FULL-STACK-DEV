<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WHYApps</h1>
            <span>Live Users: <strong id="usersCount">0</strong></span>
        </div>

        <div id="login-box">
            <h3 style="margin-bottom:15px;">Enter your name to join</h3>
            <input id="username" type="text" placeholder="Username" onkeydown="if(event.key==='Enter') joinchat()">
            <button onclick="joinchat()">Join</button>
        </div>

        <div id="chat-box">
            <div id="messages"></div>
            <div id="typing"></div>
            <div class="input-area">
                <input type="text" id="message" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const loginBox = document.getElementById('login-box');
        const chatBox = document.getElementById('chat-box');
        const messagesDiv = document.getElementById('messages');
        const typingDiv = document.getElementById('typing');
        let currentUser = '';
        let typingTimeout;

        socket.on('users-count', (count) => {
            document.getElementById('usersCount').textContent = count;
        });

        socket.on('user-joined', (username) => {
            appendNotification(username + ' joined the chat');
        });

        socket.on('user-left', (username) => {
            appendNotification(username + ' left the chat');
        });

        socket.on('receive-message', (data) => {
            const div = document.createElement('div');
            div.className = 'msg ' + (data.username === currentUser ? 'sent' : 'received');
            div.innerHTML = (data.username !== currentUser ? '<div class="name">' + data.username + '</div>' : '') +
                            '<div class="bubble">' + escapeHtml(data.message) + '</div>';
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        socket.on('user-typing', (username) => {
            if (username !== currentUser) {
                typingDiv.textContent = username + ' is typing...';
            }
        });

        socket.on('user-stopped-typing', (username) => {
            if (username !== currentUser) {
                typingDiv.textContent = '';
            }
        });

        function joinchat() {
            const username = document.getElementById('username').value.trim();
            if (!username) { alert('Please enter a username'); return; }
            currentUser = username;
            socket.emit('new-user-joined', username);
            loginBox.style.display = 'none';
            chatBox.style.display = 'block';
            document.getElementById('message').focus();
        }

        function sendMessage() {
            const input = document.getElementById('message');
            const message = input.value.trim();
            if (!message) return;
            socket.emit('send-message', message);
            socket.emit('stop-typing');
            input.value = '';
            input.focus();
        }

        document.getElementById('message').addEventListener('input', () => {
            socket.emit('start-typing');
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { socket.emit('stop-typing'); }, 1000);
        });

        function appendNotification(text) {
            const div = document.createElement('div');
            div.className = 'notification';
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
