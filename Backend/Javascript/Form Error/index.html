<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body>
    <h1>Fill the form consiously</h1>
    <form style="gap: 20px; display: flex; flex-direction: column">
      <div>
        <namebox>
          <label for="name">Name</label>
          <input type="text" name="name" id="name" />
        </namebox>
      </div>
      <div>
        <namebox>
          <label for="email">Email</label>
          <input type="email" name="email" id="email" />
        </namebox>
      </div>
      <div>
        <namebox>
          <label for="password">Password</label>
          <input type="password" name="password" id="password" />
        </namebox>
      </div>
      <div>
        <namebox>
          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            name="confirm-password"
            id="confirm-password"
          />
        </namebox>
      </div>

      <button
        id="submit"
        type="submit"
        style="
          width: 60px;
          height: 30px;
          margin-left: 110px;
          align-items: center;
        "
      >
        Submit
      </button>
    </form>

    <hr>
    <button id="fetch-image" type="button">Get Random Image</button>
    <div id="image-container" style="margin-top: 10px;"></div>

    <script>

        function successmessage() {
          Swal.fire({
            position: "top-end",
            icon: "success",
            title: "Your work has been saved",
            showConfirmButton: false,
            timer: 1500,
          });
        }

        function errormessage(text) {
          Swal.fire({
            icon: "error",
            title: "Oops...",
            text: text,
            footer: '<a href="guy.html">Why do I have this issue?</a>',
          });
        }

        function handlesubmit(event){
            event.preventDefault();
            console.log("function called");
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirm-password").value;

          if (!name || !email || !password || !confirmPassword) {
            errormessage("Please fill in all fields.");
            return;
          }

          if (!/^[A-Za-z\s]+$/.test(name)) {
            errormessage("Name should only contain letters and spaces.");
            return;
          }

          if (password !== confirmPassword) {
            errormessage("Passwords do not match.");
            return;
          }
          
          successmessage();
        };

        document.querySelector('form').addEventListener('submit', handlesubmit);

        document.getElementById('fetch-image').addEventListener('click', function() {
          fetch('https://api.api-ninjas.com/v1/randomimage?category=nature', {
            headers: {
              'X-Api-Key': '71Y40ZSWCtRq7cAaSRARCetkqeITcYRt77Dab3Gd',
              'Accept': 'image/jpg'
            }
          })
          .then(response => response.blob())
          .then(blob => {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(blob);
            img.style.maxWidth = '300px';
            document.getElementById('image-container').innerHTML = '';
            document.getElementById('image-container').appendChild(img);
          })
          .catch(() => {
            errormessage('Failed to load image.');
          });
        });
    </script>
  </body>
</html>
